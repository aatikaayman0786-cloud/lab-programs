<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .calc { background: #333; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 320px; }
        #display { width: 100%; height: 60px; background: #eee; border: none; border-radius: 8px; font-size: 28px; text-align: right; padding: 10px; margin-bottom: 15px; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { padding: 18px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        .num { background: #555; color: white; }
        .op { background: #f39c12; color: white; }
        .eq { background: #27ae60; color: white; }
        .clear { background: #e74c3c; color: white; grid-column: span 2; }
        .zero { grid-column: span 2; }
        #errorMsg { color: #e74c3c; font-size: 12px; margin-top: 8px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="calc">
        <input type="text" id="display" value="0" readonly>
        <div id="errorMsg"></div>
        <div class="buttons">
            <button class="clear" onclick="clearAll()">AC</button>
            <button class="op" onclick="appendOp('/')">÷</button>
            <button class="op" onclick="appendOp('*')">x</button>
            <button class="num" onclick="appendNum('7')">7</button>
            <button class="num" onclick="appendNum('8')">8</button>
            <button class="num" onclick="appendNum('9')">9</button>
            <button class="op" onclick="appendOp('-')">-</button>
            <button class="num" onclick="appendNum('4')">4</button>
            <button class="num" onclick="appendNum('5')">5</button>
            <button class="num" onclick="appendNum('6')">6</button>
            <button class="op" onclick="appendOp('+')">+</button>
            <button class="num" onclick="appendNum('1')">1</button>
            <button class="num" onclick="appendNum('2')">2</button>
            <button class="num" onclick="appendNum('3')">3</button>
            <button class="eq" onclick="calculate()">=</button>
            <button class="num zero" onclick="appendNum('0')">0</button>
            <button class="num" onclick="appendNum('.')">.</button>
        </div>
    </div>
    <script src="script6.js"></script>
</body>
</html>
